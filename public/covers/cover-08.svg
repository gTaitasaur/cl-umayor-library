<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 900" width="648" height="900">
  <defs>
    <pattern id="silkscreen-dots-8" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#141414" fill-opacity="0.09"/>
      <circle cx="4.5" cy="4.5" r="0.45" fill="#141414" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Papel base serigráfico crema -->
  <rect width="648" height="900" fill="#EDEBE6"/>
  <rect width="648" height="900" fill="url(#silkscreen-dots-8)"/>

  <!-- Marco fino editorial Criterion / Vasari -->
  <rect x="24" y="22" width="600" height="856" fill="none" stroke="#141414" stroke-width="1.5"/>
  <rect x="31" y="28" width="586" height="844" fill="none" stroke="#141414" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Leyenda superior -->
  <text x="324" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.2" fill="#B8332A">SELECCIÓN DEL CLUB DE LECTURA</text>
  <line x1="72" y1="80" x2="576" y2="80" stroke="#141414" stroke-width="1.2"/>

  <!-- Título grande en serif condensada -->
  <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" letter-spacing="-0.5" transform="translate(324, 178) scale(0.98, 1.04)" fill="#141414">SOLARIS</text>


  <!-- Autor y metadato editorial -->
  <line x1="244" y1="262" x2="404" y2="262" stroke="#B8332A" stroke-width="2"/>
  <text x="324" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="2.6" fill="#141414">STANISŁAW LEM</text>
  <text x="324" y="314" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#141414" fill-opacity="0.72">Ciencia Ficción · 288 págs.</text>

  <!-- Ilustración simbólica en duotono -->
  <rect x="72" y="340" width="504" height="410" fill="#141414"/>
  <g transform="translate(87, 0)">
    <circle cx="176" cy="445" r="52" fill="#B8332A"/>
    <circle cx="308" cy="422" r="28" fill="#1F3FB0"/>
    <ellipse cx="237" cy="548" rx="154" ry="38" transform="rotate(-14 237 548)" fill="none" stroke="#1F3FB0" stroke-width="3.5"/>
    <ellipse cx="237" cy="625" rx="142" ry="26" fill="none" stroke="#EDEBE6" stroke-width="2"/><ellipse cx="237" cy="643" rx="130" ry="24" fill="none" stroke="#EDEBE6" stroke-width="2"/><ellipse cx="237" cy="661" rx="118" ry="22" fill="none" stroke="#EDEBE6" stroke-width="2"/><ellipse cx="237" cy="679" rx="106" ry="20" fill="none" stroke="#EDEBE6" stroke-width="2"/><ellipse cx="237" cy="697" rx="94" ry="18" fill="none" stroke="#EDEBE6" stroke-width="2"/><ellipse cx="237" cy="715" rx="82" ry="16" fill="none" stroke="#EDEBE6" stroke-width="2"/>
  </g>

  <!-- Pie editorial e insignia enmarcada inferior derecha -->
  <text x="72" y="832" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2" fill="#141414" fill-opacity="0.72">EDICIÓN N.º 08 / 24</text>

  <g transform="translate(458, 810)">
    <rect x="0" y="0" width="118" height="32" fill="#141414"/>
    <rect x="3" y="3" width="112" height="26" fill="none" stroke="#EDEBE6" stroke-width="0.8"/>
    <text x="59" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="11" letter-spacing="1.4" fill="#EDEBE6">[AGO · 2025]</text>
  </g>
</svg>
