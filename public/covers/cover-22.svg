<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 900" width="648" height="900">
  <defs>
    <pattern id="silkscreen-dots-22" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#141414" fill-opacity="0.09"/>
      <circle cx="4.5" cy="4.5" r="0.45" fill="#141414" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Papel base serigráfico crema -->
  <rect width="648" height="900" fill="#EDEBE6"/>
  <rect width="648" height="900" fill="url(#silkscreen-dots-22)"/>

  <!-- Marco fino editorial Criterion / Vasari -->
  <rect x="24" y="22" width="600" height="856" fill="none" stroke="#141414" stroke-width="1.5"/>
  <rect x="31" y="28" width="586" height="844" fill="none" stroke="#141414" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Leyenda superior -->
  <text x="324" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.2" fill="#B8332A">SELECCIÓN DEL CLUB DE LECTURA</text>
  <line x1="72" y1="80" x2="576" y2="80" stroke="#141414" stroke-width="1.2"/>

  <!-- Título grande en serif condensada -->
  <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" letter-spacing="-0.5" transform="translate(324, 178) scale(0.98, 1.04)" fill="#141414">UN VERDOR TERRIBLE</text>


  <!-- Autor y metadato editorial -->
  <line x1="244" y1="262" x2="404" y2="262" stroke="#B8332A" stroke-width="2"/>
  <text x="324" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="2.6" fill="#141414">BENJAMÍN LABATUT</text>
  <text x="324" y="314" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#141414" fill-opacity="0.72">Ficción histórica · 224 págs.</text>

  <!-- Ilustración simbólica en duotono -->
  <rect x="72" y="340" width="504" height="410" fill="#141414"/>
  <line x1="92" y1="568" x2="282" y2="535" stroke="#EDEBE6" stroke-width="3.5"/>
  <polygon points="324,412 429,618 219,618" fill="none" stroke="#EDEBE6" stroke-width="3.5"/>
  <line x1="365" y1="518" x2="556" y2="455" stroke="#B8332A" stroke-width="4"/>
  <line x1="373" y1="534" x2="556" y2="526" stroke="#EDEBE6" stroke-width="4"/>
  <line x1="381" y1="550" x2="556" y2="600" stroke="#1F3FB0" stroke-width="4"/>
  <circle cx="324" cy="548" r="16" fill="#1F3FB0"/>

  <!-- Pie editorial e insignia enmarcada inferior derecha -->
  <text x="72" y="832" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2" fill="#141414" fill-opacity="0.72">EDICIÓN N.º 22 / 24</text>

  <g transform="translate(458, 810)">
    <rect x="0" y="0" width="118" height="32" fill="#141414"/>
    <rect x="3" y="3" width="112" height="26" fill="none" stroke="#EDEBE6" stroke-width="0.8"/>
    <text x="59" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="11" letter-spacing="1.4" fill="#EDEBE6">[OCT · 2026]</text>
  </g>
</svg>
