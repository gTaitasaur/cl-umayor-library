<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 900" width="648" height="900">
  <defs>
    <pattern id="silkscreen-dots-6" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#141414" fill-opacity="0.09"/>
      <circle cx="4.5" cy="4.5" r="0.45" fill="#141414" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Papel base serigráfico crema -->
  <rect width="648" height="900" fill="#EDEBE6"/>
  <rect width="648" height="900" fill="url(#silkscreen-dots-6)"/>

  <!-- Marco fino editorial Criterion / Vasari -->
  <rect x="24" y="22" width="600" height="856" fill="none" stroke="#141414" stroke-width="1.5"/>
  <rect x="31" y="28" width="586" height="844" fill="none" stroke="#141414" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Leyenda superior -->
  <text x="324" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.2" fill="#B8332A">SELECCIÓN DEL CLUB DE LECTURA</text>
  <line x1="72" y1="80" x2="576" y2="80" stroke="#141414" stroke-width="1.2"/>

  <!-- Título grande en serif condensada -->
  <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="35" letter-spacing="-0.5" transform="translate(324, 158) scale(0.98, 1.04)" fill="#141414">LAS CIUDADES</text>
<text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="35" letter-spacing="-0.5" transform="translate(324, 195) scale(0.98, 1.04)" fill="#141414">INVISIBLES</text>


  <!-- Autor y metadato editorial -->
  <line x1="244" y1="262" x2="404" y2="262" stroke="#B8332A" stroke-width="2"/>
  <text x="324" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="2.6" fill="#141414">ITALO CALVINO</text>
  <text x="324" y="314" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#141414" fill-opacity="0.72">Fábula poética · 184 págs.</text>

  <!-- Ilustración simbólica en duotono -->
  <rect x="72" y="340" width="504" height="410" fill="#1F3FB0"/>
  <g transform="translate(87, 0)">
    <path d="M 96 565 L 96 435 A 62 62 0 0 1 220 435 L 220 565 Z" fill="#EDEBE6"/>
    <path d="M 254 565 L 254 435 A 62 62 0 0 1 378 435 L 378 565 Z" fill="#141414"/>
    <circle cx="316" cy="445" r="22" fill="#B8332A"/>
    <path d="M 96 565 L 96 675 A 62 62 0 0 0 220 675 L 220 565" fill="none" stroke="#EDEBE6" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 254 565 L 254 675 A 62 62 0 0 0 378 675 L 378 565" fill="none" stroke="#EDEBE6" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
  <line x1="72" y1="565" x2="576" y2="565" stroke="#EDEBE6" stroke-width="3"/>

  <!-- Pie editorial e insignia enmarcada inferior derecha -->
  <text x="72" y="832" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2" fill="#141414" fill-opacity="0.72">EDICIÓN N.º 06 / 24</text>

  <g transform="translate(458, 810)">
    <rect x="0" y="0" width="118" height="32" fill="#141414"/>
    <rect x="3" y="3" width="112" height="26" fill="none" stroke="#EDEBE6" stroke-width="0.8"/>
    <text x="59" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="11" letter-spacing="1.4" fill="#EDEBE6">[JUN · 2025]</text>
  </g>
</svg>
