    <ellipse cx="185" cy="515" rx="18" ry="44" transform="rotate(-38 185 515)" fill="#1F3FB0"/><ellipse cx="289" cy="500" rx="18" ry="44" transform="rotate(38 289 500)" fill="#B8332A"/><ellipse cx="178" cy="445" rx="18" ry="44" transform="rotate(-48 178 445)" fill="#141414"/><ellipse cx="296" cy="435" rx="18" ry="44" transform="rotate(45 296 435)" fill="#1F3FB0"/><ellipse cx="237" cy="398" rx="18" ry="44" transform="rotate(0 237 398)" fill="#B8332A"/>
  </g>

