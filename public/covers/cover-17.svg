      <circle cx="4.5" cy="4.5" r="0.45" fill="#141414" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Papel base serigráfico crema -->
  <rect width="648" height="900" fill="#EDEBE6"/>
  <rect width="648" height="900" fill="url(#silkscreen-dots-17)"/>

  <!-- Marco fino editorial Criterion / Vasari -->
  <rect x="24" y="22" width="600" height="856" fill="none" stroke="#141414" stroke-width="1.5"/>
  <rect x="31" y="28" width="586" height="844" fill="none" stroke="#141414" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Leyenda superior -->
  <text x="324" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.2" fill="#1F3FB0">SELECCIÓN DEL CLUB DE LECTURA</text>
  <line x1="72" y1="80" x2="576" y2="80" stroke="#141414" stroke-width="1.2"/>

  <!-- Título grande en serif condensada -->
  <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" letter-spacing="-0.5" transform="translate(324, 178) scale(0.98, 1.04)" fill="#141414">LA VEGETARIANA</text>


  <!-- Autor y metadato editorial -->
